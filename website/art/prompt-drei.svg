<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" fill="none">
<title>Drei Schritte zu einem guten Prompt</title>
<rect x="0" y="0" width="880" height="330" rx="18" fill="#fbfcfa"/>
<path d="M56 81 V125" stroke="#bcdcca" stroke-width="2.5" stroke-linecap="round"/>
<path d="M56 173 V217" stroke="#bcdcca" stroke-width="2.5" stroke-linecap="round"/>

<rect x="100" y="18" width="750" height="78" rx="13" fill="#eaf3ee" stroke="#3d9670" stroke-width="2"/>
<circle cx="56" cy="57" r="24" fill="#eaf3ee" stroke="#1a6b47" stroke-width="2"/>
<text x="56" y="65" font-family="'Barlow','Segoe UI',system-ui,sans-serif" font-size="21" font-weight="700" fill="#1a6b47" text-anchor="middle">1</text>
<text x="130" y="52" font-family="'Barlow','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="700" fill="#0f3d2a">Der Grund und das Ziel</text>
<text x="130" y="76" font-family="'Barlow','Segoe UI',system-ui,sans-serif" font-size="14.5" font-weight="500" fill="#5d6b62">für wen, wozu, wo eure Lerngruppe steht</text>

<rect x="100" y="110" width="750" height="78" rx="13" fill="#eaf3ee" stroke="#3d9670" stroke-width="2"/>
<circle cx="56" cy="149" r="24" fill="#eaf3ee" stroke="#1a6b47" stroke-width="2"/>
<text x="56" y="157" font-family="'Barlow','Segoe UI',system-ui,sans-serif" font-size="21" font-weight="700" fill="#1a6b47" text-anchor="middle">2</text>
<text x="130" y="144" font-family="'Barlow','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="700" fill="#0f3d2a">Zeigen statt beschreiben</text>
<text x="130" y="168" font-family="'Barlow','Segoe UI',system-ui,sans-serif" font-size="14.5" font-weight="500" fill="#5d6b62">altes Blatt, Notizen, Schulbuchseite, Link</text>

<rect x="100" y="202" width="750" height="78" rx="13" fill="#eaf3ee" stroke="#3d9670" stroke-width="2"/>
<circle cx="56" cy="241" r="24" fill="#eaf3ee" stroke="#1a6b47" stroke-width="2"/>
<text x="56" y="249" font-family="'Barlow','Segoe UI',system-ui,sans-serif" font-size="21" font-weight="700" fill="#1a6b47" text-anchor="middle">3</text>
<text x="130" y="236" font-family="'Barlow','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="700" fill="#0f3d2a">Was fertig heißt</text>
<text x="130" y="260" font-family="'Barlow','Segoe UI',system-ui,sans-serif" font-size="14.5" font-weight="500" fill="#5d6b62">woran ihr es prüft, und was nicht dazugehört</text>

<text x="440" y="310" font-family="'Barlow','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="500" fill="#5d6b62" text-anchor="middle">Je klarer der Auftrag, desto weniger müsst ihr nacharbeiten.</text>
</svg>
